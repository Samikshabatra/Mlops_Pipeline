pipelineInfo:
  description: Collect, validate, train x3 in parallel, evaluate, gated deployment
  name: ai4i-predictive-maintenance
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - evaluate-models
        inputs:
          artifacts:
            pipelinechannel--evaluate-models-best_model:
              taskOutputArtifact:
