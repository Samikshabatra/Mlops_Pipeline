# PIPELINE DEFINITION
# Name: ai4i-predictive-maintenance
# Description: Collect, validate, train x3 in parallel, evaluate, gated deployment
# Inputs:
#    f1_threshold: float [Default: 0.7]
#    seed: int [Default: 42.0]
#    source_url: str [Default: 'https://archive.ics.uci.edu/static/public/601/ai4i+2020+predictive+maintenance+dataset.zip']
components:
  comp-condition-1:
    dag:
      tasks:
        deployment:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-deployment
          inputs:
            artifacts:
              best_model:
                componentInputArtifact: pipelinechannel--evaluate-models-best_model
            parameters:
              best_model_type:
                componentInputParameter: pipelinechannel--evaluate-models-best_model_type
              f1:
                componentInputParameter: pipelinechannel--evaluate-models-best_f1
              f1_threshold:
                componentInputParameter: pipelinechannel--f1_threshold
          taskInfo:
            name: deployment
    inputDefinitions:
      artifacts:
        pipelinechannel--evaluate-models-best_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--evaluate-models-best_f1:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--evaluate-models-best_model_type:
          parameterType: STRING
        pipelinechannel--f1_threshold:
          parameterType: NUMBER_DOUBLE
  comp-data-collection:
    executorLabel: exec-data-collection
    inputDefinitions:
      parameters:
        source_url:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-data-validation:
    executorLabel: exec-data-validation
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        clean_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        report:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-deployment:
    executorLabel: exec-deployment
    inputDefinitions:
      artifacts:
        best_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        best_model_type:
          parameterType: STRING
        f1:
          parameterType: NUMBER_DOUBLE
        f1_threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        packaged_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-evaluate-models:
    executorLabel: exec-evaluate-models
    inputDefinitions:
      artifacts:
        clean_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        gb_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        lr_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        rf_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        seed:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        best_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        best_f1:
          parameterType: NUMBER_DOUBLE
        best_model_type:
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        clean_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        model_type:
